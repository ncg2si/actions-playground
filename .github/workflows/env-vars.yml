name: Environment Variables
on:
  push:
    branches:
      - main
env:
  APP_ENV: development
jobs:
  define_evn:
    runs-on: ubuntu-22.04
    steps:
      - name: Print app environment variable
        run: echo "App environment is $APP_ENV"
      - name: Print stage variable
        run: echo "Stage = $STAGE"
        env:
          STAGE: test

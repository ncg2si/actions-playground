name: whole workflow build – test – run
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Building"
  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - run: echo "Testing"
  deploy:
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploying"
      
    
